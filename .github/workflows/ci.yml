name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      matrix:
        # -std=c23 needs gcc >= 14; force the generic linux target — the
        # GitHub arm runners otherwise auto-detect as pi5 (cortex-a76).
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: deps
        run: sudo apt-get update -q && sudo apt-get install -y -q libopenblas-dev gcc-14
      - name: build
        run: make CC=gcc-14 TARGET=linux
      - name: smoke test (fixture-gated half skips without the 3.7 GB model)
        run: make CC=gcc-14 TARGET=linux test

  nvim-plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update -q && sudo apt-get install -y -q neovim
      - name: headless plugin test (diktat stubbed)
        run: sh tests/nvim_smoke.sh

  deb:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: deps
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-14 lintian
      - name: build (GEMM native — the .deb carries no BLAS dependency)
        run: make CC=gcc-14 TARGET=linux GEMM_PROVIDER=native
      - name: package
        run: sh packaging/build-deb.sh
      - name: lintian (errors fail; style warnings tolerated)
        run: lintian --fail-on error geist-diktat_*.deb
      - name: install sanity
        run: |
          sudo apt-get install -y -q ./geist-diktat_*.deb
          geist-diktat 2>&1 | grep -q usage
          diktat /nonexistent.gguf </dev/null 2>&1 | grep -q "model_load failed"
      - uses: actions/upload-artifact@v4
        with:
          name: geist-diktat-deb-${{ matrix.runner }}
          path: geist-diktat_*.deb
